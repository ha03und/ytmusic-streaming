name: streaming-update

on:
  schedule:
    # cron 은 UTC 기준. KST = UTC+9
    - cron: "50 0 * * *"   # 09:50 KST -> 오전(J열)
    - cron: "20 1 * * *"   # 10:20 KST -> 오전(J열)
    - cron: "50 1 * * *"   # 10:50 KST -> 오전(J열)
    - cron: "20 2 * * *"   # 11:20 KST -> 오전(J열)
    - cron: "55 6 * * *"   # 15:55 KST -> 오후(K열)
    - cron: "25 7 * * *"   # 16:25 KST -> 오후(K열)
    - cron: "55 7 * * *"   # 16:55 KST -> 오후(K열)
    - cron: "25 8 * * *"   # 17:25 KST -> 오후(K열)
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      slot:
        description: "morning | afternoon | auto"
        default: "auto"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run updater
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          YTMUSIC_AUTH: ${{ secrets.YTMUSIC_AUTH }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          python updater.py --slot "${SLOT:-auto}"
