# 스트리밍 현황(주요곡) 자동 집계 대상 곡 설정
# - worksheet: 구글 시트의 탭(시트) 이름과 정확히 일치해야 함
# - video_id : 유튜브 뮤직 곡 id. 있으면 이걸로 확실하게 매칭한다(권장).
#              ※ 검색 API 가 돌려주는 id 기준. 브라우저 주소창 id 와 다를 수 있다.
# - query   : 유튜브 뮤직 검색어
# - artist  : 검색 결과에서 이 아티스트를 포함하는 곡만 매칭 (동명이곡 구분)
# - title   : (선택) 정확히 일치해야 하는 곡 제목. 생략 시 아티스트로만 매칭
#             ※ 생략하면 같은 아티스트의 '아무 곡'이나 잡힐 수 있다.
#               예전에 도유카에 title 이 없어서 다른 곡(2440만회)이 들어갔다.
#               되도록 title 을 적어둘 것.
# - mode    : normal(기본) | dream(두 버전+메모)
# - max_ratio: 이 곡만 상한을 따로 준다. 기본은 1.5(직전값의 1.5배).
#              신곡은 하루에 몇 배씩 뛰어서 기본 상한에 계속 걸리므로 999 로 풀어둔다.
#              재생수가 안정되면 반드시 지울 것 — 안 지우면 그 곡만 이상값 방어가 없다.
#
# 값은 유튜브 뮤직에 표시되는 "○○만회/○○억회"와 동일하게 내림 처리됩니다
# (updater.py 의 format_count 참고). 정확한 원본 조회수로 저장하려면
# 환경변수 ROUND_TO_MAN=0 으로 실행하세요.
#
# 2026-10-30: g0nny (거니) - 가버린 날들 추가 (12곡 → 13곡). 당일 18시 발매.
# 2026-10-30: 닐로(Nilo), 전상근 - 친구라는 건 추가 (11곡 → 12곡)
# 2026-10-26: max_ratio 전부 제거 (사다사잊·아홉·안갯길·dosii 4곡).
#             네 곡 모두 증가세가 안정돼 기본 상한(1.5배) 안으로 들어왔다.
#             이제 전 곡이 이상값 방어를 받는다.
# 2026-10-13: dosii - 시간 속의 향기 추가 (10곡 → 11곡)
# 2026-09-30: 9곡 제외 (19곡 → 10곡)
#   빠진 곡 — 우디 - 이 사랑 / 도유카 - Around / 치즈-이렇게 / fadeaway /
#             럽미백 / 10CM(서랍) / 샘김 / 이별후회 / 꿈
#   시트 탭은 그대로 두었고 이 목록에서만 뺐다. 되살리려면 git 이력에서 복사해오면 된다.

