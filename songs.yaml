    artist: "탑현"
    title: "바다의 왕자"

  # 2026-08-13 수정: title 이 없어서 도유카의 다른 곡
  # ("웃어넘기기엔 너무 사랑했던 너라", 2440만회)이 잡혔다. title 추가.
  # 2026-08-14 수정: 검색어에 하이픈을 넣으면 안 잡힌다(탭 이름과 검색어는 별개).
  - worksheet: "도유카 - Around"
