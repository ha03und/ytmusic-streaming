# 스트리밍 현황(주요곡) 자동 집계 대상 곡 설정
# - worksheet: 구글 시트의 탭(시트) 이름과 정확히 일치해야 함
# - query   : 유튜브 뮤직 검색어
# - artist  : 검색 결과에서 이 아티스트를 포함하는 곡만 매칭 (동명이곡 구분)
# - title   : (선택) 정확히 일치해야 하는 곡 제목. 생략 시 아티스트로만 매칭
#             ※ 생략하면 같은 아티스트의 '아무 곡'이나 잡힐 수 있다.
#               실제로 도유카에 title 이 없어서 다른 곡(2440만회)이 들어갔다.
#               되도록 title 을 적어둘 것.
# - mode    : normal(기본) | dream(태연 꿈: 두 버전+메모)
#
# 값은 유튜브 뮤직에 표시되는 "○○만회/○○억회"와 동일하게 내림 처리됩니다
# (updater.py 의 format_count 참고). 정확한 원본 조회수로 저장하려면
# 환경변수 ROUND_TO_MAN=0 으로 실행하세요.

songs:
  - worksheet: "경서 - 슈퍼스타"
    video_id: "7bBtEEVCeHE"
    query: "경서 슈퍼스타"
    artist: "경서"
    title: "슈퍼스타"

  # 2026-08-14: video_id 는 7DnwSeOsejE 가 맞다.
  # 브라우저 주소창의 Ep6o9_n0taU 로 바꿔봤더니 검색 결과에 그 id 가 아예 없어서
  # 제목으로만 맞추는 상태가 됐다(로그의 [주의]). 검색 API 가 돌려주는 id 기준으로
  # 적어야 한다 — 주소창 id 와 다를 수 있다.
  - worksheet: "파테코 - Rainy day"
    video_id: "7DnwSeOsejE"
    query: "Rainy day 파테코"
    artist: ["PATEKO", "파테코"]
    title: "Rainy day (feat. ASH ISLAND, Skinny Brown)"

  - worksheet: "탑현 - 바다의 왕자"
    video_id: "CkuQvUdpkog"
    query: "바다의 왕자 탑현"
    artist: "탑현"
    title: "바다의 왕자"

  # 2026-08-13 수정: title 이 없어서 도유카의 다른 곡
  # ("웃어넘기기엔 너무 사랑했던 너라", 2440만회)이 잡혔다. title 추가.
  # 2026-08-14 수정: 검색어에 하이픈을 넣으면 안 잡힌다(탭 이름과 검색어는 별개).
  - worksheet: "도유카 - Around"
